[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
 
 
[tool.setuptools]
packages = ["SPOT",
            "SPOT.Analysis",
            "SPOT.Detection", 
            "SPOT.Features", 
            "SPOT.Image",
            "SPOT.Registration", 
            "SPOT.Tracking",
            "SPOT.Utility_Functions"]
  
[project]
name="SAM-SPOT"
description="Shape, appearance, motion Phenotype Observation Tool for streamlined live-cell phenotyping temporal analysis"
authors = [{name='Felix Y. Zhou', email='felixzhou1@gmail.com'}]
readme = "README.md"
license={text = "LICR Software License"}
version = "0.1.1"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


# TensorFlow is no longer a core dependency (the detection / segmentation networks have PyTorch versions; the original
# Keras functions need the keras-legacy extra), which allows Python 3.9 - 3.13 and NumPy 2.
requires-python = ">=3.9, <3.14"
dependencies = [
    'numpy>=1.23',
	'pillow',
	'mahotas',
    'matplotlib',
    'scikit-image',
    'scikit-learn',
    'scipy',
    'opencv-python-headless>=4.8',
	'tqdm',
    'tifffile',
    'seaborn',
    'networkx',
    'hmmviz',
    'hmmlearn',
    'pandas',
    'joblib',
    'numexpr',
    'imagecodecs',
    'dtaidistance'
    ]

[project.optional-dependencies]
pacmap = ["pacmap"]
analysis = ["umap-learn", "statsmodels", "fastcluster"]
gpu = ["torch>=2.2"]
detection = ["torch>=2.2", "h5py"]
keras-legacy = ["tensorflow"]
test = ["pytest"]
docs = ["sphinx", "numpydoc", "sphinx_rtd_theme"]

[project.urls]
Homepage = "https://github.com/fyz11/SPOT"
Issues = "https://github.com/fyz11/SPOT/issues"
